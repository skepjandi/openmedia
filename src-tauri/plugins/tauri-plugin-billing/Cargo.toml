[package]
name = "tauri-plugin-billing"
version = "0.1.0"
authors = ["openmedia"]
description = "RevenueCat-backed in-app purchases for OpenMedia (iOS and macOS StoreKit 2, Android Google Play Billing)"
license = "MPL-2.0"
repository = "https://github.com/skepjandi/openmedia"
edition = "2024"
rust-version = "1.90"
links = "tauri-plugin-billing"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

# Only a macOS host can build the Swift package, and linking swift-rs into the build script fails
# on Windows (unresolved `retain_object`), so no other host compiles it.
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.7", features = ["build"] }

[lints]
workspace = true
