[package]
name = "tauri-plugin-siteview"
version = "0.1.0"
authors = ["openmedia"]
description = "Native site view host for OpenMedia (iOS WKWebView, Android WebView, macOS child WKWebView)"
license = "MPL-2.0"
repository = "https://github.com/skepjandi/openmedia"
edition = "2024"
rust-version = "1.90"
links = "tauri-plugin-siteview"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = "1"

# Desktop site views are Tauri child webviews, which sit behind the `unstable` feature.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.5", features = ["unstable"] }
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

# macOS reads navigation state and manages content rule lists straight from the WKWebView.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationSound", "UNNotificationTrigger", "UNNotificationSettings"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAPublicDefines", "LAError"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSBundle", "NSGeometry", "NSString", "NSURL", "NSValue"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKUserScript", "WKContentRuleList", "WKContentRuleListStore", "objc2-core-foundation"] }

# Windows reads page history from WebView2 and asks Windows Hello for the owner check.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"

# Linux moves the page views into a GtkOverlay and reads page history from WebKitGTK; the versions
# are the ones Tauri itself uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "2", features = ["v2_40"] }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[lints]
workspace = true
