[package]
name = "tauri-plugin-siteview"
version = "0.1.0"
authors = ["openmedia"]
description = "Native site view host for OpenMedia (iOS WKWebView, Android WebView)"
license = "MPL-2.0"
repository = "https://github.com/skepjandi/openmedia"
edition = "2024"
rust-version = "1.90"
links = "tauri-plugin-siteview"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = "1"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
