[package]
name = "openmedia"
version = "0.1.0"
description = "Load any website and reshape it with declarative recipes"
authors = ["OpenMedia contributors"]
license = "MPL-2.0"
repository = "https://github.com/skepjandi/openmedia"
edition = "2024"
rust-version = "1.90"

[workspace]
members = ["plugins/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openmedia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-siteview = { version = "0.1.0", path = "plugins/tauri-plugin-siteview" }
tauri-plugin-billing = { version = "0.1.0", path = "plugins/tauri-plugin-billing" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
# Parses and serializes the recipe `script` rules for the script policy. oxc changes its API on every
# release, so the versions are pinned exactly and bumped together.
oxc_parser = "=0.158.0"
oxc_allocator = "=0.158.0"
oxc_span = "=0.158.0"
oxc_semantic = "=0.159.0"
oxc_ast = { version = "=0.158.0", features = ["serialize"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1.13.1"
zeroize = "1.9.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2.5.8"
# Brave's filter engine. The resource assembler supplies URL-matched scriptlet code.
adblock = { version = "0.13.5", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "resource-assembler"] }
sha2 = "0.11"
ring = "0.17"
base64 = "0.23"
flate2 = "1"
percent-encoding = "2.3"
# Downloads run as tasks on the runtime Tauri already provides; these are the parts of it they use.
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }

# Desktop builds that ship outside the stores replace themselves (`self_update.rs`); the store builds
# (iOS, Android, Mac App Store) are updated by their store and never compile this in.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

# Reading another browser's own files (`import/browsers`): its SQLite databases (history, saved
# logins, Firefox places) and the AES Chromium browsers use for saved passwords.
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = "0.1"

[features]
self-update = ["dep:tauri-plugin-updater"]

# Android has no `keyring` backend; its secrets live in the Android Keystore (see `secrets.rs`).
# Every other target needs a real OS store, because `keyring` silently falls back to an in-memory
# mock without one. Linux talks to the Secret Service (GNOME Keyring, KWallet) through zbus, which
# is pure Rust: no libdbus to bundle in the AppImage. `async-io` keeps zbus off Tauri's tokio runtime.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
scraper = "0.29.0"
tempfile = "3"


# Line tables only: panics and `sample` still show source lines, but target/ stays a fraction of
# the size (a full debug build of the iOS target filled a laptop disk).
[profile.dev]
debug = "line-tables-only"

# The blocklist test compiles about 190,000 URL patterns; unoptimized that takes over a minute.
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = false
debug = "line-tables-only"

# AGENTS.md: no `unwrap()`/`expect()` outside tests; errors propagate as typed errors.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints]
workspace = true
