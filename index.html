<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>OpenMedia</title>
    <style>
      /* The splash continues the native launch screen: same colour, same logo, same size and
         place, so nothing changes when the web view takes over. Keep in step with
         LaunchScreen.storyboard and SiteViewPlugin.installBackdrop. */
      html,
      body {
        margin: 0;
        background: #070b14;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070b14;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
      }
      #splash .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, #0d1a36 0%, transparent 65%);
        opacity: 0;
        animation: splash-glow 0.5s ease-out forwards;
      }
      #splash .mark {
        position: relative;
        width: min(52vmin, 240px);
        height: min(52vmin, 240px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash svg {
        position: relative;
        width: 100%;
        height: 100%;
        transform-box: fill-box;
        transform-origin: center;
        animation: splash-float 2.4s ease-in-out 0.3s infinite;
      }
      #splash .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid #06aff8;
        opacity: 0;
        animation: splash-ring 2s ease-out 0.3s infinite;
      }
      #splash .ring:nth-child(2) {
        animation-delay: 1s;
      }
      #splash[data-hidden] {
        opacity: 0;
        transform: scale(1.08);
        pointer-events: none;
      }
      @keyframes splash-glow {
        to {
          opacity: 1;
        }
      }
      @keyframes splash-float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-8px) scale(1.04);
        }
      }
      @keyframes splash-ring {
        from {
          opacity: 0.55;
          transform: scale(0.7);
        }
        to {
          opacity: 0;
          transform: scale(1.7);
        }
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f4f7fc;
        }
        #splash {
          background: #f4f7fc;
        }
        #splash .glow {
          background: radial-gradient(circle at 50% 45%, #ffffff 0%, transparent 65%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg,
        #splash .ring {
          animation: none;
        }
        #splash .ring {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash">
      <div class="glow"></div>
      <div class="mark">
        <span class="ring"></span><span class="ring"></span>
        <!--logo-mark-->
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
