<!doctype html>
<!-- tiktok mobile screen time sheet (iPhone UA) captured from https://www.tiktok.com/foryou on 2026-11-13: structure only, text and personal data removed. -->
<html lang="en">
<body>
<div id="app">
  <div class="DivContentContainer" data-keep>
    <div class="DivFixedPageContainer">
      <div class="DivFlex1">
        <div class="DivHeaderContainer"><a class="StyledLinkSearch" href="/search">Search</a></div>
      </div>
    </div>
  </div>
</div>
<div class="box-border text-color-TextPrimary">
  <div class="tt-sheet__mask fixed background-color-SDSecondary z-2000 opacity-0 mask-hidden" role="none"></div>
  <div class="tt-sheet__container radius-containerslevel1-large-t pb-safe fixed z-2000 flex flex-col high">
    <div class="tt-sheet__header flex-shrink-0">
      <div data-theme="light" dir="ltr">
        <div data-test-tag="tux-nav-bar" class="TUXNavBar">
          <div class="box-border top-0 left-0 right-0">
            <header class="flex items-center px-8 overflow-hidden relative" role="navigation"></header>
          </div>
        </div>
      </div>
    </div>
    <div class="tt-sheet__body flex-1">
      <div class="tt-sheet-intro">
        <div class="tt-intro__container overflow-hidden absolute left-0 right-0 bottom-0 top-0 flex flex-col justify-between">
          <div class="tt-intro__scroll-body w-full box-content overflow-auto">
            <div class="mb-16 mt-36 px-16 flex justify-center"><img class="tt-intro__large-image w-full" alt=""></div>
            <div class="px-32 text-center"><h1 class="mt-0 mb-12 text-color-TextPrimary H1-Bold">Screen time breaks</h1><h4 class="px-16 mb-36"><span data-test-tag="tux-text" class="H4-Regular">Break reminders help you feel more mindful and balanced on TikTok.</span></h4></div>
          </div>
          <div class="tt-intro__button-container"><button class="tt-intro__button">Turn on reminders</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
