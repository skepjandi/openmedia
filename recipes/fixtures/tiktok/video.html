<!doctype html>

<div id="app">
  <div class="layout-box DivLayoutBox" data-keep>

      <div class="DivFixedWrapper">

          <div class="DivBannerContent"><a href="https://www.tiktok.com">Global video community</a></div>

        </div>
      </div>
      <div class="DivVideoCard" id="video-card-normal" data-keep>
        <div class="DivVideoCover">
          <div class="DivContent">
            <div class="DivVideoCaption">
              <div class="DivRightAreaPos">
                <div class="DivOperaterArea">
                  <div data-e2e="play-side-author"><div class="DivPointerEvent"><a href="/@user"><div class="DivAvatarContainer"><img alt="author"></div></a></div></div>
                  <div data-e2e="play-side-like"><div><a href="/@user/video/1"><div><svg></svg><span>3296</span></div></a></div></div>
                  <div data-e2e="play-side-comment"><div><a href="/@user/video/1"><div><div><svg></svg></div><span>1097</span></div></a></div></div>
                  <div data-e2e="play-side-share"><div><a href="/@user/video/1"><div><svg></svg><span>437</span></div></a></div></div>
                </div>
              </div>
              <article data-e2e="video-desc"><h1>caption</h1><a href="/@user">@user</a></article>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div data-e2e="launch-popup-close">Continue on web</div>
      </div>
      <div>
        <div>
          <div class="DivWrapper"><div class="DivTuxBarContainer" data-e2e="recommend-list-tab-container">You may like</div></div>
          <ul class="UlRList" data-e2e="recommend-list">
            <li class="recommend-item"><div><a href="/@other/video/2">other</a><img alt=""></div></li>
          </ul>
        </div>
      </div>
      <div class="DivBottomButtonSection">
        <p>Enjoy more content in the app</p>
        <div class="bottom-button-container">
          <div class="matrix-smart-wrapper"><div class="DivFooterCTA" data-e2e="bottom_banner">Watch on TikTok</div></div>
        </div>
      </div>
      <div class="DivFixedWrapper">
        <div class="DivTopBannerAB">
          <div class="DivTitleAB"><a href="/@user">Get the full experience on the app</a></div>
          <div class="DivOpenBtnAB" data-e2e="bottom-banner-open"><a href="/@user">Open</a></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="launch-popup-sheet-host">
  <div>
    <div class="box-border">
      <div class="tt-sheet__mask" role="none"></div>
      <div class="tt-sheet__container">
        <div class="DivSheetPanel"><div data-e2e="launch-popup-title">Watch this video on TikTok</div><a href="#">Watch now</a></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
