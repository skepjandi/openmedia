<!doctype html>

<html lang="en">
<body>
<div class="flex h-dvh w-screen overflow-hidden">
  <div class="fixed inset-0 -z-10 h-dvh w-screen pointer-events-none"><img alt="" src="/images/jpop.jpg"></div>
  <aside class="w-55 h-full">
    <nav data-keep><a href="/" data-keep></a></nav>
    <div class="flex items-center gap-1.5"><span class="text-xs font-medium tabular-nums"></span></div>
  </aside>
  <div class="flex flex-col flex-1 min-w-0">
    <main data-keep class="flex-1 overflow-y-auto">
      <div class="glass flex items-center gap-4">
        <button type="button" aria-label="Play radio" data-keep></button>
        <a href="/sources/1"></a>
        <button type="button" aria-label="Toggle lyrics" data-lyrics-trigger=""></button>
      </div>
      <div class="hidden sm:block"><a class="block" href="/albums/4565"><div><img alt="Album art" src="https://cdn.listen.moe/covers/cover.jpg"></div></a></div>
    </main>
    <div class="min-h-14"><a class="block" href="/albums/4565"><div><img alt="Album art" src="https://cdn.listen.moe/covers/cover.jpg"></div></a></div>
  </div>
</div>
</body>
</html>
