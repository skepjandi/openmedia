<!doctype html>
<!-- Structure observed on a pin page on www.pinterest.com, macOS Safari UA 1280x800, logged out, 2026-11-13 (rendered DOM, headless Chrome); text, links and images are placeholders. On desktop the pin itself is the first list item of relatedPins, so that item is data-keep. data-keep marks what no rule may hide. -->
<html lang="en">
  <body>
    <div id="__PWS_ROOT__">
      <div data-test-id="unauth-header" data-keep><div data-test-id="login-button"><button>Log in</button></div><div data-test-id="signup-button"><button>Sign up</button></div><div data-test-id="search-box-container" data-keep><input aria-label="Search"></div></div>
      <div data-test-id="relatedPins">
        <div data-test-id="MobileFeed" data-keep>
          <div data-test-id="grid"><div data-test-id="feed"><div data-test-id="masonry-container"><div data-test-id="max-width-container">
            <div role="list">
              <div data-grid-item="true" role="listitem">
                <div data-grid-item-idx="0">
                  <div data-test-id="CloseupMainPin" data-keep>
                    <div data-test-id="closeup-container" data-keep>
                      <div data-test-id="pin-closeup-image" data-keep><img alt="Pin" src="x.jpg"></div>
                      <div data-test-id="visual-search-icon"><div role="button"></div></div>
                    </div>
                    <div data-test-id="CloseupDetails" data-keep>
                      <div data-test-id="pinTitle">Title</div>
                      <div data-test-id="pin-action-bar-container" data-keep><button data-test-id="react-button"></button><button data-test-id="share-button"></button></div>
                      <div data-test-id="aggregated-comment-list"><div data-test-id="commentThread-comment"><div data-test-id="text-container">Comment</div></div></div>
                      <div data-test-id="comments-count-container"><div data-test-id="unauth-comment-composer"><div data-test-id="comment-editor-container"></div></div></div>
                    </div>
                  </div>
                </div>
              </div>
              <div data-grid-item="true" role="listitem"><div data-grid-item-idx="1"><div data-test-id="gated-pin-rep"><div data-test-id="gated-pin-image"><img alt="Pin" src="y.jpg"></div></div></div></div>
              <div data-grid-item="true" role="listitem"><div data-grid-item-idx="2"><div data-test-id="gated-pin-rep"><div data-test-id="gated-pin-video"><video></video></div><div data-test-id="PinTypeIdentifier">0:10</div></div></div></div>
            </div>
          </div></div></div></div>
        </div>
      </div>
      <div data-test-id="bottom-right-upsell"><button aria-label="Close bottom right upsell"></button><div>You are signed out</div></div>
      <div data-test-id="fullPageSignupModal"><div role="dialog" aria-label="modal" aria-modal="true"><div data-test-id="login-modal-redesign"><button data-test-id="google-connect-button">Continue with Google</button></div></div></div>
    </div>
  </body>
</html>
