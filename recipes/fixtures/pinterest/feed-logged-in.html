<!doctype html>
<!-- HAND-WRITTEN, not captured: the logged-in home feed and shopping modules need a sign-in. Attribute names (role=listitem, title="Sponsored", data-test-id pin / pinWrapper / product-price-text / duplo-shopping-module ...) are the ones the Pinterest Power Menu userscript (Angel2mp3/Pinterest-Power-Menu) and uBlockOrigin/uAssets issue 18369 use. data-keep marks what no rule may hide. -->
<html lang="en">
  <body>
    <div id="__PWS_ROOT__">
      <div role="list" data-keep>
        <div role="listitem" data-keep><div data-test-id="pinWrapper" data-keep><div data-test-id="pin" data-keep><img alt="Pin" src="a.jpg"></div></div></div>
        <div role="listitem"><div data-test-id="pinWrapper"><div data-test-id="pin"><img alt="Pin" src="b.jpg"></div><div title="Sponsored">Promoted by Brand</div></div></div>
        <div role="listitem"><div data-test-id="pinWrapper"><div data-test-id="pin"><img alt="Pin" src="c.jpg"></div><div title="Partner Content">Partner</div></div></div>
        <div role="listitem"><div data-test-id="pinWrapper"><div data-test-id="otpp"></div></div></div>
        <div role="listitem"><div data-test-id="pinWrapper"><div data-test-id="pin"><img alt="Pin" src="d.jpg"><div aria-label="Shoppable Pin indicator"></div></div><div data-test-id="product-price-text">$19</div></div></div>
        <div role="listitem"><div data-test-id="pincard-product-with-link"><img alt="Product" src="e.jpg"></div></div>
      </div>
      <div data-test-id="duplo-shopping-module"><h2>Shop the look</h2></div>
      <div data-test-id="ShopTheLookSimilarProducts"></div>
      <div data-test-id="visual-search-shopping-bar"></div>
      <div data-test-id="related-products"></div>
      <div data-test-id="ShopTheLookAnnotations"></div>
      <div role="listitem"><div data-test-id="shopping-module"></div></div>
    </div>
  </body>
</html>
