<!doctype html>
<!-- Hand-written from the data-pagelet and aria-label attributes www.facebook.com serves to desktop browsers when signed in (the logged-out desktop page is only the login form, so nothing here was captured live). data-keep marks what no rule may hide. -->
<html><body>
<div role="banner" data-keep>
  <a aria-label="Home" role="link" href="/" data-keep></a>
  <a aria-label="Watch" role="link" href="/watch/"></a>
  <a aria-label="Marketplace" role="link" href="/marketplace/"></a>
  <a aria-label="Gaming" role="link" href="/gaming/"></a>
  <a aria-label="Reels" role="link" href="https://www.facebook.com/reel/?s=tab"></a>
</div>
<div role="main" data-keep>
  <div data-pagelet="LeftRail"><a href="/friends/"></a></div>
  <div data-pagelet="Stories"></div>
  <div role="feed" data-keep>
    <div data-pagelet="FeedUnit_0" data-keep><a href="/someone/posts/1"></a></div>
    <div data-pagelet="FeedUnit_1"><a href="/reel/1"></a></div>
    <div data-pagelet="FeedUnit_2"><a href="/ads/about/?id=1"></a></div>
  </div>
  <div data-pagelet="RightRail"><div><a href="/ads/about/?id=2"></a></div><div></div></div>
</div>
</body></html>
