<!doctype html>
<!-- Hand-written logged-in profile and feed structure (no account was used): follower links, grid links, post media and like count follow the community lists named in recipes/official/instagram.json notes. data-keep marks what no rule may hide. -->
<html><body>
<div id="react-root">
  <main role="main">
    <header>
      <section><canvas></canvas><img src="/avatar.jpg" alt=""></section>
      <section><a href="/someone/followers/">1 follower</a><a href="/someone/following/">2 following</a></section>
    </header>
    <div data-keep>
      <a href="/p/abc/"><img src="/a.jpg" alt=""></a>
      <a href="/reel/def/"><img src="/b.jpg" alt=""></a>
    </div>
    <article>
      <header><img src="/avatar2.jpg" alt=""></header>
      <div><img src="/post.jpg" srcset="/post.jpg 1x" alt=""><video></video></div>
      <section><a href="/p/abc/liked_by/">12 likes</a></section>
    </article>
  </main>
</div>
</body></html>
