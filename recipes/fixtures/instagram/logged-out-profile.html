<!doctype html>
<!-- Structure observed on a logged-out profile in an iPhone-UA tab, 2026-11-07 and re-checked 2026-11-13 (avatar section, follower links, grid pictures, /u/direct/ bar link); text and links are placeholders. data-keep marks what no rule may hide. -->
<html><body>
<div id="react-root">
  <header>
    <a href="/">Instagram</a>
    <a data-keep href="/accounts/login/">Log in</a>
    <a href="https://applink.instagram.com/?utm_source=open_app">Open app</a>

    <header>
      <section><canvas></canvas><a href="https://applink.instagram.com/profile-avatar"><img src="/avatar.jpg" alt=""></a></section>

    <div role="tablist">
      <div><svg aria-label="Posts"></svg></div>
      <div><svg aria-label="Reels"></svg></div>
    </div>

    <div data-keep><a href="https://applink.instagram.com/p/tile-1"><img src="/t1.jpg" alt=""></a><a href="https://applink.instagram.com/p/tile-2"><img src="/t2.jpg" alt=""></a></div>

    </div></div></div>
  </div>

    <div><a href="/explore/">Explore</a></div>

  </div>
</div>
