<!doctype html>
<!-- Post anatomy observed on www.threads.com (iPhone UA, logged out, 2026-11-13) on the home feed and on /@zuck: classes, text, ids and links are placeholders, the picture/carousel wrappers are reduced to the nodes the selectors use. data-keep marks what no rule may hide. -->
<html lang="en">
  <body>
    <div id="barcelona-page-layout">
      <div id="profile-header">
        <div><img alt="example's profile picture"></div>
        <div><a href="https://www.instagram.com/example/" role="link" tabindex="0">instagram.com/example</a></div>
        <div data-keep><span dir="auto">Example profile</span></div>
      </div>
      <div data-pagelet="threads_profile_posts_timeline_0">
        <div>
          <div data-pressable-container="true" data-keep>
            <div>
              <div>
                <div><a href="/@example.user" role="link" tabindex="0"><div><img alt="example.user's profile picture"></div></a></div>
              </div>
              <div>
                <div>
                  <span>
                    <div><span><div><a href="/@example.user" role="link" tabindex="0" data-keep><span dir="auto"><span>example.user</span></span></a></div></span></div>
                    <span><svg aria-label="Verified" role="img" viewBox="0 0 24 24"><title>Verified</title></svg></span>
                  </span>
                  <div>
                    <div>
                      <span><span><svg viewBox="0 0 24 24"></svg></span></span>
                      <div><a href="/search?q=Example%20topic&amp;serp_type=tags&amp;tag_id=1" role="link" tabindex="0"><div><span dir="auto"><span>Example topic</span></span></div></a></div>
                    </div>
                    <div><span dir="auto"><a href="/@example.user/post/ABC123" role="link" tabindex="0" data-keep><time data-visualcompletion="ignore-dynamic"><span><abbr aria-label="14 hours ago"><span>14h</span></abbr></span></time></a></span></div>
                  </div>
                </div>
                <div><div><div role="button" tabindex="0"><div><svg role="img" viewBox="0 0 24 24"><title>More</title></svg></div></div></div></div>
              </div>
            </div>
            <div>
              <div><span dir="auto" data-keep><span>Placeholder post text.</span></span></div>
              <div>
                <div role="button" tabindex="0">
                  <div>
                    <div>
                      <div style="--x-aspectRatio: 1.33;">
                        <div>
                          <div>
                            <picture><img alt="" draggable="false" height="1500" width="2000"></picture>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div>
                <div>
                  <video playsinline></video>
                </div>
              </div>
              <div>
                <div>
                  <div role="button" tabindex="0"><div><div><svg role="img" viewBox="0 0 24 24"><title>Like</title></svg><span dir="auto"><div><span>1.3K</span></div></span></div></div></div>
                </div>
                <div>
                  <div role="button" tabindex="0"><div><div><svg role="img" viewBox="0 0 24 24"><title>Comment</title></svg><span dir="auto"><div><span>162</span></div></span></div></div></div>
                </div>
                <div>
                  <div role="button" tabindex="0"><div><div><svg role="img" viewBox="0 0 24 24"><title>Repost</title></svg><span dir="auto"><div><span>53</span></div></span></div></div></div>
                </div>
                <div>
                  <div role="button" tabindex="0"><div><div><svg role="img" viewBox="0 0 24 24"><title>Share</title></svg><span dir="auto"><div><span>30</span></div></span></div></div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
