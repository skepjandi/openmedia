<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>YouTube Music fixture (390px): SYNTHETIC, hand-written, not captured from YouTube Music</title></head>
<body>
<!-- Synthetic: stands in for the elements the generic rules target. It proves the selectors compile and
     leave the protected content alone; it does not prove YouTube Music serves any of these elements. -->
<ytmusic-mealbar-promo-renderer>Try Premium</ytmusic-mealbar-promo-renderer>
<ytmusic-statement-banner-renderer>Banner</ytmusic-statement-banner-renderer>
<ytmusic-upsell-dialog-renderer>Upgrade</ytmusic-upsell-dialog-renderer>
<ytmusic-pivot-bar-item-renderer tab-id="SPunlimited">Upgrade</ytmusic-pivot-bar-item-renderer>
<div id="onetrust-consent-sdk">Cookies</div>
<main data-keep>
  <nav data-keep><a href="/" data-keep>Home</a></nav>
  <section data-keep><h1>Content</h1><video data-keep></video></section>
</main>
</body>
</html>
