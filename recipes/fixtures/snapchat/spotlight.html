<!doctype html>
<html><body>
<div data-testid="page-frame">
  <header data-testid="top-nav">
    <div data-testid="mobile-nav">
      <button aria-label="Open Mobile Navigation" data-keep></button>
      <a class="mobile-nav-module-scss-module__nalrDq__downloadButton" href="https://click.snapchat.com/x"><span>Open Snapchat</span></a>
    </div>
  </header>
  <main>
    <section data-testid="spotlight-scaffold" data-layout="mobile" data-keep>
      <div data-testid="spotlight-mobile">
        <div data-testid="spotlight-player" data-keep>
          <div role="region" aria-label="Spotlight video" aria-roledescription="video player" data-player-frame><video></video></div>
          <div data-testid="spotlight-strip">
            <div class="swiper"><div class="swiper-wrapper">
              <div data-testid="spotlight-slide" data-active="true">
                <div data-testid="spotlight-active-overlays">
                  <div data-testid="spotlight-metadata"><a href="https://www.snapchat.com/@example" data-testid="spotlight-creator">Example Creator</a></div>
                  <div data-testid="spotlight-sound">Original Sound</div>
                  <div role="group" aria-label="Video engagement" data-testid="spotlight-engagement-rail">
                    <a href="https://www.snapchat.com/@example" data-testid="spotlight-rail-creator"><span>Example Creator</span></a>
                    <button type="button" class="action"><span class="srOnly">Like</span><span class="spotlight-mobile-engagement-rail-module-scss-module__AUM0va__count">3.6M</span></button>
                    <button type="button" class="action"><span class="srOnly">Recommend</span><span class="spotlight-mobile-engagement-rail-module-scss-module__AUM0va__count">83K</span></button>
                    <button type="button" class="action"><span class="srOnly">Comment</span></button>
                    <button type="button" class="action"><span class="srOnly">Share</span><span class="spotlight-mobile-engagement-rail-module-scss-module__AUM0va__count">140K</span></button>
                    <span class="copyLinkAnchor">Copy link</span>
                  </div>
                </div>
              </div>
            </div></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<nav aria-label="Primary destinations" data-testid="mobile-tab-bar">
  <ul><li><a href="https://link.snapchat.com/spotlight">Spotlight</a></li></ul>
</nav>
</body></html>
