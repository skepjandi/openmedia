<!doctype html>
<!-- Hand-written facebook.com/messages structure (logged-in only, nothing captured): roles, aria-labels and the thread-list label come from Caprine (css/browser.css), the Messenger Hide Chat List userscript and Shadeed's bubble article, named in recipes/official/messenger.json notes. data-keep marks what no rule may hide. -->
<html><body>
<div role="banner"><a href="/">Facebook</a></div>
<div role="navigation">
  <div data-keep><input type="search" placeholder="Search Messenger"></div>
  <div aria-label="Thread list">
    <div role="grid"><div role="row"><img alt=""><svg><image></image></svg></div></div>
  </div>
</div>
<div role="main" data-keep>
  <div role="button" aria-label="Start a voice call"></div>
  <div role="button" aria-label="Start a video call"></div>
  <div role="grid" aria-label="Messages in conversation with Someone">
    <div role="row"><div role="gridcell"><img alt=""></div></div>
  </div>
  <div role="textbox" contenteditable="true" data-keep></div>
</div>
</body></html>
