<!doctype html>
<!-- Hand-written from Telegram Web A (github.com/Ajaxy/telegram-tt) component sources; the logged-in app is not reachable logged out. -->
<html lang="en"><body>
<div id="root">
  <div id="LeftColumn" data-keep>
    <div class="chat-list">
      <div class="ListItem Chat">
        <div class="Avatar size-large"><div class="inner"><img src="" alt=""></div></div>
        <div class="info"><h3>Chat title</h3></div>
      </div>
    </div>
  </div>
  <div id="MiddleColumn" data-keep>
    <div class="Message">
      <div class="message-content">
        <div class="text-content">Message placeholder</div>
        <div class="WebPage">
          <p class="site-name">Example</p>
          <p class="site-title">Link title</p>
          <p class="site-description">Link description</p>
        </div>
        <span class="MessageMeta"><span class="message-views">1.2K</span><span class="message-time">12:00</span></span>
      </div>
    </div>
    <div class="Composer" data-keep><div contenteditable="true"></div></div>
  </div>
</div>
</body></html>
