<!doctype html>
<html>
<body class="widget_frame_base tgme_webpreview mobile">
  <header class="tgme_header search_collapsed">
    <div class="tgme_container">
      <div class="tgme_header_search" data-keep>
        <form class="tgme_header_search_form" action="/s/channel">
          <input class="tgme_header_search_form_input js-header_search" placeholder="Search" name="q">
        </form>
      </div>
      <div class="tgme_header_info">
        <a class="tgme_channel_join_telegram" href="//telegram.org/dl?tme=placeholder">Join</a>
        <a class="tgme_header_link" href="https://t.me/channel" data-keep>
          <div class="tgme_header_title_wrap">Channel title</div>
          <div class="tgme_header_counter">1M subscribers</div>
        </a>
      </div>
    </div>
  </header>
  <main class="tgme_main">
    <div class="tgme_container">
      <section class="tgme_channel_history js-message_history" data-keep>
        <div class="tgme_widget_message_centered js-messages_more_wrap">
          <a href="/s/channel?before=3" class="tme_messages_more js-messages_more"></a>
        </div>
        <div class="tgme_widget_message_wrap js-widget_message_wrap">
          <div class="tgme_widget_message js-widget_message" data-post="channel/1">
            <div class="tgme_widget_message_user"><a href="https://t.me/channel"><i class="tgme_widget_message_user_photo"></i></a></div>
            <div class="tgme_widget_message_bubble">
              <div class="tgme_widget_message_forwarded_from accent_color">Forwarded from&nbsp;<span class="tgme_widget_message_forwarded_from_name"><span dir="auto">Source</span></span></div>
              <div class="tgme_widget_message_author"><a class="tgme_widget_message_owner_name" href="https://t.me/channel"><span>Channel title</span></a></div>
              <a class="tgme_widget_message_photo_wrap" href="https://t.me/channel/1">
                <div class="tgme_widget_message_photo"></div>
              </a>
              <div class="tgme_widget_message_text" data-keep>Post text placeholder</div>
              <div class="tgme_widget_message_reactions js-message_reactions"><span class="tgme_reaction"><tg-emoji emoji-id="1"></tg-emoji>46.2K</span></div>
              <div class="tgme_widget_message_footer compact js-message_footer">
                <div class="tgme_widget_message_info short js-message_info">
                  <span class="tgme_widget_message_views">1K</span><span class="copyonly"> views</span><span class="tgme_widget_message_meta"><a class="tgme_widget_message_date" href="https://t.me/channel/1"><time class="time">12:00</time></a></span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="tgme_widget_message_wrap js-widget_message_wrap">
          <div class="tgme_widget_message js-widget_message" data-post="channel/2">
            <div class="tgme_widget_message_bubble">
              <a class="tgme_widget_message_reply js-message_reply" href="https://t.me/channel/1">
                <span class="tgme_widget_message_author_name">Channel title</span>
                <div class="tgme_widget_message_text js-message_reply_text">Quoted post placeholder</div>
              </a>
              <a class="tgme_widget_message_video_player js-message_video_player ready" href="https://t.me/channel/2">
                <i class="tgme_widget_message_video_thumb"></i>
                <div class="tgme_widget_message_video_wrap"><video class="tgme_widget_message_video js-message_video" width="100%" height="100%"></video></div>
              </a>
              <div class="tgme_widget_message_text" data-keep>Another post placeholder</div>
              <a class="tgme_widget_message_link_preview" href="https://example.com/article">
                <div class="link_preview_site_name accent_color">Example</div>
                <i class="link_preview_image"></i>
                <div class="link_preview_title">Link title</div>
                <div class="link_preview_description">Link description</div>
              </a>
              <div class="tgme_widget_message_footer compact js-message_footer">
                <div class="tgme_widget_message_info short js-message_info">
                  <span class="tgme_widget_message_views">2K</span><span class="tgme_widget_message_meta"><a class="tgme_widget_message_date" href="https://t.me/channel/2"><time class="time">12:30</time></a></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
