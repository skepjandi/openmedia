<!doctype html>
<!-- netflix.com logged-in browse page: TRIMMED RECONSTRUCTION, not a capture (Netflix needs a login, which this project never uses). Class names and data-list-context values are taken from public community filter lists and userscripts (uBlock Origin netflix.com filters, bbbbbr/netflix-disable-auto-play-and-more, Greasy Fork "Netflix Disable Billboard Video", the r/uBlockOrigin "Hiding Netflix Games" post, JustZix Netflix examples). The element nesting is simplified. data-keep marks what no rule may hide. -->
<html lang="en"><body>
<div data-keep="" id="appMountPoint">
<div class="mainView">
<div class="pinning-header"><a data-keep="" data-uia="header-search" href="/search">Search</a></div>
<div class="lolomo is-fullbleed">
<div class="billboard-row">
<div class="billboard billboard-pane">
<div class="billboard-motion"><video></video></div>
<img class="static-image" alt="">
<div class="volatile-billboard-animations-container"></div>
</div>
</div>
<div class="lolomoRow lolomoRow_title_card" data-list-context="continueWatching">
<div class="title-card-container"><div class="title-card"><div class="boxart-container"><img class="boxart-image" alt=""></div></div>
<span class="maturity-rating"><span class="maturity-number">16</span></span>
<span class="match-score-wrapper"><span class="match-score">98% Match</span></span></div>
</div>
<div class="lolomoRow lolomoRow_title_card" data-list-context="queue"><div class="title-card"><img class="boxart-image" alt=""></div></div>
<div class="lolomoRow lolomoRow_title_card" data-list-context="trending"><div class="title-card"><img class="boxart-image" alt=""></div></div>
<div class="lolomoRow lolomoRow_title_card" data-list-context="becauseYouAdded"><div class="title-card"><img class="boxart-image" alt=""></div></div>
<div class="lolomoRow lolomoRow_title_card" data-list-context="popularGames"><div class="title-card"><img class="boxart-image" alt=""></div></div>
<div class="lolomoRow lolomoRow_title_card" data-list-context="configbased_cloudpersonalizedgames"><div class="title-card"><img class="boxart-image" alt=""></div></div>
<div data-keep="" class="lolomoRow lolomoRow_title_card" data-list-context="genre"><a data-keep="" href="/browse/genre/1">Genre</a></div>
</div>
<div class="previewModal--container">
<div class="previewModal--player_container"><video></video></div>
<button data-keep="" data-uia="play-button">Play</button>
<div class="moreLikeThis--container"><div class="title-card"><img class="boxart-image" alt=""></div></div>
</div>
</div>
</div>
</body></html>
