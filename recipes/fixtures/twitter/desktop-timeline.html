<!doctype html>
<!-- Hand-written from the data-testid and aria-label attributes the classic x.com web app serves to desktop browsers when signed in (logged out, x.com serves the rebuilt front end without them; see the recipe notes), so nothing here was captured live. data-keep marks what no rule may hide. -->
<html><body>
<header role="banner" data-keep>
  <nav role="navigation" data-keep>
    <a href="/home" data-keep></a>
    <a href="/jobs"></a>
    <a href="/someone/communities"></a>
    <a href="/someone/lists"></a>
  </nav>
</header>
<main role="main" data-keep>
  <div data-testid="primaryColumn" data-keep>
    <article data-testid="tweet" data-keep>
      <svg data-testid="icon-verified"></svg>
      <div data-testid="reply"><span data-testid="app-text-transition-container"></span></div>
      <div data-testid="retweet"><span data-testid="app-text-transition-container"></span></div>
      <div data-testid="unretweet"><span data-testid="app-text-transition-container"></span></div>
      <div data-testid="like"><span data-testid="app-text-transition-container"></span></div>
      <div data-testid="unlike"><span data-testid="app-text-transition-container"></span></div>
    </article>
  </div>
  <div data-testid="sidebarColumn">
    <section><div data-testid="trend"></div></section>
    <div aria-label="Timeline: Trending now"></div>
    <aside aria-label="Subscribe to Premium"><a href="/i/premium_sign_up"></a></aside>
    <aside aria-label="Who to follow"><div data-testid="UserCell"></div></aside>
  </div>
</main>
<div data-testid="DMDrawer"></div>
</body></html>
