<div class="sticky"><a data-keep data-interaction="mobile-top-bar-log-in" href="/i/flow/login">Log in</a></div>

  <article data-keep>
    <div>
      <div data-post-avatar="true"><a href="/example" data-status="active"><div><img alt=""></div></a></div>

        <span><a href="/example" data-status="active" data-keep><div>Example</div></a><span role="button" aria-label="Verified account"><svg role="img" aria-label="Verified account"><use href="#icon-verified-premium-color"></use></svg></span></span>

          <div><div data-post-avatar="true"><a href="/other"><div><img alt=""></div></a></div></div>
          <div>Quoted post text.</div>

      </div>
      <div data-slot="xds-context-menu-trigger">
        <div data-press-control=""><div><video></video></div></div>

      <div role="group" aria-label="3057 replies, 4273 reposts, 28169 likes">
