<!doctype html>
<!-- Hand-written from the ytd-* markup YouTube serves to desktop Safari; these are the elements that were not on the pages captured live on 2026-11-10 (the other desktop-*.html files). data-keep marks what no rule may hide. -->
<html><body>
<ytd-app data-keep>
  <ytd-guide-renderer data-keep>
    <ytd-guide-section-renderer data-keep><ytd-guide-entry-renderer data-keep><a href="/feed/subscriptions"></a></ytd-guide-entry-renderer></ytd-guide-section-renderer>
    <ytd-guide-section-renderer>
      <ytd-guide-entry-renderer><a href="/premium"></a></ytd-guide-entry-renderer>
      <ytd-guide-entry-renderer><a href="https://music.youtube.com/"></a></ytd-guide-entry-renderer>
    </ytd-guide-section-renderer>
    <div id="footer"></div>
  </ytd-guide-renderer>
  <ytd-mini-guide-renderer data-keep>
    <ytd-mini-guide-entry-renderer data-keep><a href="/"></a></ytd-mini-guide-entry-renderer>
    <ytd-mini-guide-entry-renderer><a href="/premium"></a></ytd-mini-guide-entry-renderer>
  </ytd-mini-guide-renderer>
  <ytd-watch-flexy data-keep>
    <div class="html5-video-player" data-keep>
      <div class="ytp-ce-element"></div>
      <div class="ytp-endscreen-content"></div>
      <div class="ytp-pause-overlay"></div>
    </div>
    <ytd-live-chat-frame></ytd-live-chat-frame>
    <ytd-merch-shelf-renderer></ytd-merch-shelf-renderer>
    <ytd-ticket-shelf-renderer></ytd-ticket-shelf-renderer>
  </ytd-watch-flexy>
  <ytd-search data-keep>
    <ytd-video-renderer data-keep><a href="/watch?v=x"></a></ytd-video-renderer>
    <ytd-video-renderer><a href="/shorts/x"></a></ytd-video-renderer>
    <ytd-playlist-renderer></ytd-playlist-renderer>
    <ytd-radio-renderer></ytd-radio-renderer>
  </ytd-search>
  <ytd-compact-video-renderer data-keep><a href="/watch?v=y"></a></ytd-compact-video-renderer>
  <ytd-compact-video-renderer><a href="/shorts/y"></a></ytd-compact-video-renderer>
  <ytd-compact-playlist-renderer></ytd-compact-playlist-renderer>
  <ytd-compact-radio-renderer></ytd-compact-radio-renderer>
  <ytd-grid-video-renderer data-keep><a href="/watch?v=z"></a></ytd-grid-video-renderer>
  <ytd-grid-video-renderer><a href="/shorts/z"></a></ytd-grid-video-renderer>
  <ytd-grid-playlist-renderer></ytd-grid-playlist-renderer>
</ytd-app>
</body></html>
