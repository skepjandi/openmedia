<!doctype html>
<!-- m.youtube.com home with an iPhone UA, logged out, 2026-11-07; titles removed. data-keep marks what no rule may hide. -->
<html><body>
<ytm-app data-keep>
  <ytm-mobile-topbar-renderer data-keep>
    <ytm-button-renderer><a href="vnd.youtube://www.youtube.com/watch?v=x">Open App</a></ytm-button-renderer>
    <ytm-button-renderer data-keep class="icon-microphone_on"><button></button></ytm-button-renderer>
  </ytm-mobile-topbar-renderer>
  <ytm-browse data-keep>
    <ytm-feed-filter-chip-bar-renderer>
      <ytm-chip-cloud-chip-renderer><chip-shape aria-label="Shorts"></chip-shape></ytm-chip-cloud-chip-renderer>
      <ytm-chip-cloud-chip-renderer><chip-shape aria-label="Music"></chip-shape></ytm-chip-cloud-chip-renderer>
    </ytm-feed-filter-chip-bar-renderer>
    <ytm-rich-grid-renderer data-keep>
      <div class="rich-grid-renderer-contents">
        <ytm-rich-item-renderer><yt-lockup-view-model></yt-lockup-view-model></ytm-rich-item-renderer>
        <ytm-rich-section-renderer><ytm-shorts-lockup-view-model></ytm-shorts-lockup-view-model></ytm-rich-section-renderer>
      </div>
    </ytm-rich-grid-renderer>
  </ytm-browse>
  <ytm-pivot-bar-renderer data-keep>
    <ytm-pivot-bar-item-renderer data-keep><div class="pivot-home"></div></ytm-pivot-bar-item-renderer>
    <ytm-pivot-bar-item-renderer><div class="pivot-shorts"><div class="pivot-shorts"></div></div></ytm-pivot-bar-item-renderer>
    <ytm-pivot-bar-item-renderer><div class="pivot-subs"></div></ytm-pivot-bar-item-renderer>
    <ytm-pivot-bar-item-renderer><div class="pivot-you"></div></ytm-pivot-bar-item-renderer>
  </ytm-pivot-bar-renderer>
  <ytm-mealbar-promo-renderer></ytm-mealbar-promo-renderer>
  <ytm-statement-banner-renderer></ytm-statement-banner-renderer>
  <ytm-upsell-dialog-renderer></ytm-upsell-dialog-renderer>
  <ytm-brand-video-singleton-renderer></ytm-brand-video-singleton-renderer>
  <ytm-promoted-sparkles-web-renderer></ytm-promoted-sparkles-web-renderer>
  <ytm-promoted-video-renderer></ytm-promoted-video-renderer>
  <ytm-ad-slot-renderer></ytm-ad-slot-renderer>
  <ytm-masthead-ad-renderer></ytm-masthead-ad-renderer>
</ytm-app>
</body></html>
