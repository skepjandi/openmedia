name: OTA

# Publishes updates. Every step is `yarn ota ...`, the same command you run on your own machine
# when Actions minutes are short (docs/wiki/updates.md).
#
#   push to main (web layer changed)  -> signed web bundle on the `ota` release, every platform
#   push of a v* tag                  -> web bundle + Windows and Linux installers + latest.json,
#                                        published on the GitHub release v<version> (marked latest)
#
# Windows and Linux are the free platforms and the only ones published here. iOS, Android and
# macOS ship through their stores; never add them to this workflow (AGENTS.md).
#   manual run                        -> either, chosen below

on:
  push:
    branches: [main]
    paths:
      - src/**
      - index.html
      - vite.config.ts
      - tsconfig.json
      - package.json
      - yarn.lock
      - src-tauri/tauri.conf.json
      - src-tauri/ota-public-key.txt
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: What to publish
        type: choice
        options: [web, app, all]
        default: web

permissions:
  contents: write

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: false


jobs:
  web:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || inputs.publish != 'app')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: A tag must name the version being released
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but tauri.conf.json says $version"; exit 1; }
      - run: yarn test
      - run: yarn ota web
        env:
          GH_TOKEN: ${{ github.token }}
          OPENMEDIA_OTA_KEY: ${{ secrets.OPENMEDIA_OTA_KEY }}

  app:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish != 'web')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: yarn install --frozen-lockfile
      - run: yarn ota app --no-manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENMEDIA_SHARE_URL: ${{ secrets.OPENMEDIA_SHARE_URL }}

  manifest:
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/ota.mjs manifest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Mark the release latest and publish its notes
        run: |
          notes="$(mktemp)"
          node scripts/ota.mjs notes > "$notes"
          gh release edit "v$(node -p 'require("./src-tauri/tauri.conf.json").version')" --latest --notes-file "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
